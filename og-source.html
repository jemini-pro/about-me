<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8" />
<title>OG source — capture at 600×315, 2×</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Space+Grotesk:wght@400;500&display=swap" />
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 600px; height: 315px; overflow: hidden; }
  body {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 170px;
    gap: 20px;
    padding: 26px 28px 22px;
    background: #f3f0e8;
    color: #141412;
    font-family: 'Space Grotesk', system-ui, sans-serif;
  }
  .left { display: flex; flex-direction: column; min-width: 0; }
  .role {
    margin: 0;
    font-size: 8.5px;
    font-weight: 500;
    line-height: 1;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: #a83a14;
  }
  h1 {
    margin: 14px 0 0;
    font-family: 'Instrument Serif', Georgia, serif;
    font-weight: 400;
    font-size: 48px;
    line-height: .9;
    letter-spacing: -.035em;
  }
  h1 .dot { color: #a83a14; }
  .summary {
    margin: 12px 0 0;
    max-width: 40ch;
    font-size: 10.5px;
    line-height: 1.45;
    color: #3a382f;
  }
  .foot {
    margin-top: auto;
    padding-top: 8px;
    border-top: 1px solid rgba(20, 20, 18, .16);
    display: flex;
    justify-content: space-between;
    gap: 10px;
    font-size: 7px;
    font-weight: 500;
    line-height: 1;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: #6c695f;
  }
  .shot {
    border: 1px solid rgba(20, 20, 18, .18);
    overflow: hidden;
  }
  .shot img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center 45%;
  }
</style>
</head>
<body>
  <div class="left">
    <p class="role">Operations Manager · Survey Air</p>
    <h1>Jem Karaceylan<span class="dot">.</span></h1>
    <p class="summary">Drone surveys, photogrammetry and LiDAR, and the software that delivers the data.</p>
    <div class="foot">
      <span>jemini-pro.github.io/about-me</span>
      <span>Farnham, Surrey</span>
    </div>
  </div>
  <div class="shot">
    <img src="./assets/geomapper-3d.png" alt="" />
  </div>
</body>
</html>
