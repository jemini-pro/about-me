<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8" />
<title>OG source — capture at 600×315, 2×</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Space+Grotesk:wght@400;500&display=swap" />
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 600px; height: 315px; overflow: hidden; }
  body {
    display: flex;
    flex-direction: column;
    padding: 34px 36px 30px;
    background: #f3f0e8;
    color: #141412;
    font-family: 'Space Grotesk', system-ui, sans-serif;
  }
  .dateline {
    margin: 0 0 26px;
    font-size: 8px;
    font-weight: 500;
    line-height: 1;
    letter-spacing: .16em;
    text-transform: uppercase;
    color: #6c695f;
  }
  h1 {
    margin: 0 0 14px;
    font-family: 'Instrument Serif', Georgia, serif;
    font-weight: 400;
    font-size: 72px;
    line-height: .9;
    letter-spacing: -.035em;
  }
  h1 .dot { color: #a83a14; }
  .standfirst {
    margin: 0;
    max-width: 46ch;
    font-size: 13.5px;
    line-height: 1.45;
    color: #3a382f;
  }
  .foot {
    margin-top: auto;
    padding-top: 10px;
    border-top: 1px solid rgba(20, 20, 18, .18);
    display: flex;
    justify-content: space-between;
    gap: 16px;
    font-size: 8px;
    font-weight: 500;
    line-height: 1;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: #6c695f;
  }
</style>
</head>
<body>
  <p class="dateline">Farnham, Surrey · November 2026</p>
  <h1>Jem Karaceylan<span class="dot">.</span></h1>
  <p class="standfirst">Operations Manager at Survey Air. Drone surveys, photogrammetry and LiDAR, and the software that delivers the data.</p>
  <div class="foot">
    <span>jemini-pro.github.io/about-me</span>
    <span>Operations Manager, Survey Air</span>
  </div>
</body>
</html>
